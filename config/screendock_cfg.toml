# Default/example configuration for screendockd.
#
# This file at the repo root is read directly when running out of a git checkout (see
# src/screendockd/src/utils/config.rs's resolution order). It is also the packaged
# default/template shipped by the .deb/.rpm build to /etc/screendockd/screendock_cfg.toml (see
# src/screendockd/Cargo.toml's [package.metadata.deb]/[package.metadata.generate-rpm] asset
# lists) - a package install can't pre-populate every future user's $XDG_CONFIG_HOME, so this
# system-wide file is the fallback default until a user has their own
# ~/.config/screendockd/screendock_cfg.toml.
#
# Values below match the dock's confirmed native panel resolution and this project's defaults; see
# docs/configuration.md for every field.

[display]
# Encoded picture size in pixels. Defaults to the dock's native panel size. Both must be even,
# between 16 and 4096, and agree with the orientation (landscape: width >= height, portrait:
# height >= width). The video header carries this width and height.
width = 1280
height = 720
# One of "landscape" or "portrait".
orientation = "landscape"

[capture]
# One of "auto", "x11" or "wayland". "auto" follows the detected session ($XDG_SESSION_TYPE, then
# $WAYLAND_DISPLAY, then $DISPLAY). "wayland" needs a build with the capture-wayland feature.
backend = "auto"
# X11 display to capture, for example ":0". Leave unset to use $DISPLAY.
# x11_display = ":0"
# Capture frame rate. 0 captures as fast as the backend allows.
fps = 25

[encode]
# libx264 preset: "ultrafast", "superfast", "veryfast", "faster", "fast" or "medium". Slower
# presets give better quality at one bit rate and cost more CPU.
preset = "ultrafast"
# Apply libx264's zerolatency tune (no lookahead, no frame delay).
tune_zerolatency = true
# Target H.264 bit rate in kilobits per second. It is also the VBV maximum rate. Fast moving
# content looks blocky or glitchy when this is too low for the picture.
bitrate_kbps = 4000
# Frames between keyframes (about two seconds at 25 fps).
keyframe_interval = 50
# VBV buffer in milliseconds of bitrate_kbps. It bounds the size of any one frame, keyframes
# included (100 ms at 4000 kbit/s is 400 kbit). 0 turns the cap off.
vbv_buffer_ms = 100

[virtual_display]
# "mirror" captures an existing screen and scales it to the dock. "extend" creates a monitor for
# the dock and captures exactly that monitor. Switchable at runtime. The monitor size is the
# [display] width and height.
mode = "mirror"
# Where the monitor sits relative to the anchor: "right-of", "left-of", "above", "below" or
# "at" (the x and y below). Applied on X11 and sway; GNOME and the portal choose their own layout.
placement = "right-of"
# Output name the placement is relative to, or "primary".
anchor = "primary"
# Monitor position when placement is "at".
x = 0
y = 0
# Monitor name. Empty uses the name from the dock's EDID, else "ScreenDock".
name = ""
# What to do when the monitor cannot be created: "mirror" (continue and report the reason) or "fail".
fallback = "mirror"
# Wayland mechanism: "auto" (Mutter on GNOME, a headless output on sway, else the portal), "mutter",
# "portal" or "wlroots".
wayland_backend = "auto"
# Follow size, rotation and position changes made in the desktop's display settings.
follow_system_changes = true
# Where the monitor's identity data comes from: "dock" (the dock's EDID) or "synthetic".
edid = "dock"
# Restore the previous layout when the daemon exits.
restore_on_exit = true

[control]
# Serve the control socket used by `screendockd ctl`.
enabled = true
# Socket path. Empty uses $XDG_RUNTIME_DIR/screendockd/control.sock.
socket = ""

[daemon]
# Tracing/log level: "trace", "debug", "info", "warn", or "error". Overridable at runtime via
# the RUST_LOG environment variable, which takes precedence over this value (see
# utils/logging.rs).
log_level = "info"
# Heartbeat tick interval for the MI_00 control channel, in milliseconds. The protocol spec
# calls for roughly once per second.
heartbeat_interval_ms = 1000

[device]
# USB vendor/product ID override, for testing against a different hidraw node setup (e.g. a
# mocked device) without recompiling. Leave at the dock's real values for normal use.
vendor_id_hex = "1de1"
product_id_hex = "f201"
