Section "Device"
  Identifier "dock-dev"
  Driver "dummy"
  VideoRam 256000
EndSection
Section "Monitor"
  Identifier "dock-mon"
  HorizSync 5-1000
  VertRefresh 5-200
  Modeline "1280x720_60" 74.25 1280 1390 1430 1650 720 725 730 750 +hsync +vsync
EndSection
Section "Screen"
  Identifier "dock-scr"
  Device "dock-dev"
  Monitor "dock-mon"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Virtual 1280 720
    Modes "1280x720_60"
  EndSubSection
EndSection
Section "InputClass"
  Identifier "dock keyboard"
  MatchIsKeyboard "on"
  MatchDevicePath "/dev/input/event*"
  Driver "libinput"
EndSection
Section "InputClass"
  Identifier "dock pointer"
  MatchIsPointer "on"
  MatchDevicePath "/dev/input/event*"
  Driver "libinput"
EndSection
Section "ServerFlags"
  Option "AutoAddGPU" "false"
EndSection
Section "ServerLayout"
  Identifier "dock-layout"
  Screen "dock-scr"
EndSection
