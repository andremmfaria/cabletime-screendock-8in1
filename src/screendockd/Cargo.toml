[package]
name = "screendockd"
version = "1.1.2"
edition = "2021"
description = "Independent, unofficial Linux userspace driver for the CABLETIME ScreenDock (CB09W, VID_1DE1&PID_F201). Not affiliated with or endorsed by CableTime."
license = "MIT"

# Exposing both a lib and a bin target lets `tests/` (integration tests) exercise the crate's
# modules directly, while `src/main.rs` stays a thin binary entry point.
[lib]
name = "screendockd"
path = "src/lib.rs"

[[bin]]
name = "screendockd"
path = "src/main.rs"

[dependencies]
# Typed error enums in discovery.rs and protocol/framing.rs derive via thiserror.
thiserror = "1"
# utils/config.rs (personal project convention): serde + toml for simple, idiomatic TOML deserialization — chosen over the
# `config` crate because the layered-source/env-var-override machinery `config` offers is
# redundant here, since this project hand-implements its own explicit 4-step resolution order
# (env var -> XDG user config -> /etc system default -> repo-root dev path) rather than
# delegating source precedence to a config-merging library.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# utils/config.rs: resolves the XDG user config directory ($XDG_CONFIG_HOME, defaulting to
# ~/.config) correctly and cross-platform-safely, rather than hand-rolling HOME-env-var string
# concatenation.
dirs = "5"
# utils/logging.rs (personal project convention): tracing + tracing-subscriber, chosen over
# log + env_logger because this daemon is a concurrent multi-loop program (capture/encode/
# heartbeat threads per the Architecture section) and tracing's spans let each loop's log lines
# carry structured, span-scoped context (e.g. which loop/thread emitted a line) that plain `log`
# has no equivalent for.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# protocol/heartbeat.rs: builds the MI_00 JSON-RPC heartbeat message.
serde_json = "1"
# main.rs: application-boundary error type; library modules keep typed thiserror enums.
anyhow = "1"
# main.rs: CLI argument parsing (daemon and hardware validation subcommands).
clap = { version = "4", features = ["derive"] }
# adapters/capture/x11_shm.rs: pure-Rust X11 client with the MIT-SHM extension; needs no system libs.
x11rb = { version = "0.14", features = ["shm"] }
# Anonymous shared-memory segment (memfd) handed to the X server for XShm captures, and the
# mapping used to read it.
rustix = { version = "1", features = ["fs"] }
memmap2 = "0.9"
# `capture` subcommand: writes captured frames as PNG.
png = "0.17"
# Wayland capture (feature `capture-wayland`): xdg-desktop-portal ScreenCast via ashpd, frames
# consumed from PipeWire. Needs libpipewire-0.3 dev files at build time.
ashpd = { version = "0.14", optional = true, default-features = false, features = ["screencast", "tokio"] }
pipewire = { version = "0.10", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "macros"] }
# H.264 encoding (feature `encode-ffmpeg`): libx264 through libavcodec. Needs libavcodec,
# libavformat, libavutil, libswscale and libavdevice development files plus clang at build time.
ffmpeg-next = { version = "9.1", optional = true }
# `run` subcommand: SIGINT/SIGTERM set the shutdown flag.
signal-hook = "0.4"
# `bench` subcommand: process CPU time through getrusage.
libc = "0.2"

[features]
default = ["tools"]
# Hardware validation and measurement tools: the replay, isolate and bench subcommands and
# the tools module.
tools = []
# testing::fake_dock for tests; enabled only through the self dev-dependency, never in a
# shipped build.
testing = []
capture-wayland = ["dep:ashpd", "dep:pipewire", "dep:tokio"]
encode-ffmpeg = ["dep:ffmpeg-next"]

[dev-dependencies]
tempfile = "3"
screendockd = { path = ".", default-features = false, features = ["testing"] }

[[test]]
name = "protocol"
path = "tests/protocol/main.rs"

[[test]]
name = "session"
path = "tests/session/main.rs"

[[test]]
name = "capture"
path = "tests/capture/main.rs"

[[test]]
name = "encode"
path = "tests/encode/main.rs"
required-features = ["encode-ffmpeg"]

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

# Packaging metadata for `cargo-deb` (CI builds this via `cargo deb`, see
# .github/workflows/package.yml). The daemon is installed as a per-user systemd unit
# (see deploy/screendockd.service), so the systemd unit ships to the system-wide
# user-unit directory (/usr/lib/systemd/user/) rather than /lib/systemd/system/ —
# cargo-deb has no built-in "user unit" mode, so the unit is shipped as a plain asset
# instead of using its `systemd-units` auto-integration (which assumes system units).
[package.metadata.deb]
maintainer = "Andre Faria <amarcalfaria@waratek.com>"
copyright = "2026, Andre Faria <amarcalfaria@waratek.com>"
license-file = ["../../LICENSE", "0"]
# "Linux userspace driver for a specific HID display device" has no closer match than
# x11/utils in Debian's section list; kept to the standard set rather than invented.
section = "utils"
priority = "optional"
assets = [
    ["target/release/screendockd", "usr/bin/screendockd", "755"],
    ["../../deploy/99-screendock.rules", "lib/udev/rules.d/99-screendock.rules", "644"],
    ["../../deploy/screendockd.service", "usr/lib/systemd/user/screendockd.service", "644"],
    # Packaged default/template config. utils/config.rs's resolution order falls back to this
    # system-wide path (third step) when no per-user $XDG_CONFIG_HOME/screendockd/ config
    # exists yet — a package install can't pre-populate every future user's home directory, so
    # it ships a template here instead; see utils/config.rs for the full resolution order.
    ["../../config/screendock_cfg.toml", "etc/screendockd/screendock_cfg.toml", "644"],
]
# Runtime library dependencies are derived from the release binary (it links libavcodec and
# friends when built with the encode-ffmpeg feature); the libx264 encoder arrives through
# libavcodec's own dependencies.
depends = "$auto"

# Packaging metadata for `cargo-generate-rpm` (CI builds this via `cargo generate-rpm`).
# Paths/rationale mirror the [package.metadata.deb] section above.
[package.metadata.generate-rpm]
license = "MIT"
assets = [
    { source = "target/release/screendockd", dest = "/usr/bin/screendockd", mode = "755" },
    { source = "../../deploy/99-screendock.rules", dest = "/usr/lib/udev/rules.d/99-screendock.rules", mode = "644" },
    { source = "../../deploy/screendockd.service", dest = "/usr/lib/systemd/user/screendockd.service", mode = "644" },
    # See the matching entry in [package.metadata.deb] above for why this ships a system-wide
    # template rather than relying solely on a per-user XDG config.
    { source = "../../config/screendock_cfg.toml", dest = "/etc/screendockd/screendock_cfg.toml", mode = "644" },
]

# The binary links libavcodec/libavformat/libavutil/libswscale (encode-ffmpeg feature);
# ffmpeg-libs provides them with libx264 support on Fedora-family systems (RPM Fusion).
[package.metadata.generate-rpm.requires]
ffmpeg-libs = "*"
