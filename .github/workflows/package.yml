name: Package

# tag-release.yml calls this workflow directly (workflow_call) after it moves or creates the
# v<version> tag. Tags pushed with GITHUB_TOKEN never trigger other workflows, so a plain
# `push: tags` trigger alone would never fire for those tags. The tag push trigger stays for
# tags pushed by a person, and workflow_dispatch allows a manual run.
on:
  workflow_call: {}
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# contents: write is required to create/update the GitHub Release and attach assets to it,
# using the workflow's own GITHUB_TOKEN — no extra secret is configured or needed.
permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/screendockd
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # The packaged binary is built with the libx264 encoder, so the libav development files
      # (and clang for bindgen) are needed at build time. Screen capture over X11 is pure Rust
      # and always compiled in.
      - name: Install system packages
        run: >
          sudo apt-get update && sudo apt-get install -y xvfb
          libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavdevice-dev
          libx264-dev clang pkg-config

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/screendockd

      - name: Build release binary
        run: cargo build --release --verbose --features encode-ffmpeg

      # cargo-deb and cargo-generate-rpm aren't part of the default toolchain; `cargo install`
      # builds them from source off crates.io using nothing but network access + GITHUB_TOKEN's
      # implicit checkout auth (no extra secret). `--locked` pins to each tool's own lockfile for
      # reproducibility.
      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      # (1) .crate — the Cargo/crates.io package archive format. This deliberately stops at
      # `cargo package` and never runs `cargo publish`: a real crates.io publish needs an API
      # token secret nobody has configured yet, and this project isn't ready for a public
      # crates.io release. See the "Follow-ups" note in the project's CI docs/summary.
      - name: Build .crate package (cargo package, NOT cargo publish)
        run: cargo package --allow-dirty

      # (2) .deb — built via cargo-deb using the [package.metadata.deb] section in Cargo.toml
      # (maintainer/section/depends/assets for the binary + udev rule + systemd user unit).
      - name: Build .deb package (cargo deb)
        run: cargo deb --no-build

      # (3) .rpm — built via cargo-generate-rpm using the [package.metadata.generate-rpm]
      # section in Cargo.toml, mirroring the same asset layout as the .deb.
      - name: Build .rpm package (cargo generate-rpm)
        run: cargo generate-rpm

      # Collect all three artifacts into one place so the release step below has simple,
      # predictable glob paths regardless of each tool's own output directory naming.
      - name: Collect built artifacts
        run: |
          mkdir -p dist
          cp target/package/*.crate dist/
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          ls -l dist/

      # softprops/action-gh-release in update mode: if tag-release.yml moved an existing tag
      # (version unchanged, new commit), this updates that tag's existing release in place
      # instead of erroring on "release already exists"; if the tag is new, it creates the
      # release. Either way all three built files end up as downloadable release assets, not
      # just workflow-run build artifacts.
      - name: Read crate version
        id: version
        run: echo "tag=v$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')" >> "$GITHUB_OUTPUT"

      - name: Upload packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: src/screendockd/dist/*
          if-no-files-found: error

      - name: Create or update GitHub Release with built assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: src/screendockd/dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
