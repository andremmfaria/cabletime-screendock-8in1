name: CI

# Runs on every push/PR touching main so breakage is caught before it lands, and on PRs
# targeting main from any branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The crate lives at src/screendockd/, not the repo root (see docs/implementation-plan.md
        # "Project Structure") — every cargo invocation below runs from there.
        working-directory: src/screendockd
    steps:
      - uses: actions/checkout@v4

      # dtolnay/rust-toolchain is the more actively maintained of the two common
      # toolchain-install actions (actions-rs/toolchain is unmaintained as of this writing).
      # `components` pulls in rustfmt + clippy so the checks below don't need a separate install step.
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo and target/ keyed on the lockfile/manifest, scoped to this crate's path
      # so it doesn't collide with the packaging workflow's own cache.
      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/screendockd

      # Xvfb backs the X11 capture integration tests (tests/capture/).
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Check formatting (cargo fmt)
        run: cargo fmt --check

      # Warnings are errors: fix a new clippy warning rather than loosening this check.
      - name: Lint (cargo clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (cargo build)
        run: cargo build --verbose

      # The core, ports, adapters and app layers must build without the tools feature.
      - name: Lint without default features
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Build without default features
        run: cargo build --no-default-features

      # The testing feature is enabled only through the dev-dependency, so a shipped build
      # must not list it.
      - name: Check the shipped feature graph
        run: |
          if cargo tree -e normal,features -f '{p} {f}' | grep -q testing; then
            echo "the testing feature is enabled in a normal build"
            exit 1
          fi

      # SCREENDOCK_REQUIRE_XVFB turns "Xvfb missing or unusable" from a skip into a failure, so
      # the X11 capture tests cannot silently stop running in CI.
      - name: Test (cargo test)
        run: cargo test --verbose
        env:
          SCREENDOCK_REQUIRE_XVFB: "1"

      # The Wayland backend needs the PipeWire development files (and clang for bindgen); this
      # compile check keeps the feature building even though no portal exists on the runner.
      - name: Install PipeWire development packages
        run: sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev clang pkg-config

      - name: Lint with capture-wayland feature
        run: cargo clippy --all-targets --features capture-wayland -- -D warnings

  # First real compile of the libx264 encoder: needs the libav development files, clang for
  # bindgen, and the ffmpeg binary so the test can decode what the encoder produced.
  encode-ffmpeg:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/screendockd
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/screendockd
          key: encode-ffmpeg

      - name: Install libav development packages
        run: >
          sudo apt-get update && sudo apt-get install -y
          libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavdevice-dev
          libx264-dev clang pkg-config ffmpeg xvfb

      - name: Lint with encode-ffmpeg feature
        run: cargo clippy --all-targets --features encode-ffmpeg -- -D warnings

      # SCREENDOCK_REQUIRE_FFMPEG makes a missing ffmpeg binary a failure instead of a skip.
      - name: Test with encode-ffmpeg feature
        run: cargo test --features encode-ffmpeg --verbose
        env:
          SCREENDOCK_REQUIRE_XVFB: "1"
          SCREENDOCK_REQUIRE_FFMPEG: "1"
